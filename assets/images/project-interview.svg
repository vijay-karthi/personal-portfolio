<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1A1D23" />
  <!-- Background Pattern -->
  <g stroke="#262A33" stroke-width="1">
    <path d="M0,50 H600 M0,100 H600 M0,150 H600 M0,200 H600 M0,250 H600 M0,300 H600 M0,350 H600" />
    <path d="M50,0 V400 M100,0 V400 M150,0 V400 M200,0 V400 M250,0 V400 M300,0 V400 M350,0 V400 M400,0 V400 M450,0 V400 M500,0 V400 M550,0 V400" />
  </g>
  <!-- Card Overlay -->
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#0F1115" stroke="#0F766E" stroke-width="2" />
  <!-- UI Mock Header -->
  <rect x="40" y="40" width="520" height="40" rx="16" fill="#1A1D23" />
  <circle cx="70" cy="60" r="5" fill="#EF4444"/>
  <circle cx="85" cy="60" r="5" fill="#F59E0B"/>
  <circle cx="100" cy="60" r="5" fill="#10B981"/>
  <text x="300" y="65" fill="#D6B25E" font-family="Space Grotesk" font-size="12" text-anchor="middle">Claude API AI Interview Simulator &amp; Aptitude Test</text>
  
  <!-- Content Mock -->
  <rect x="70" y="100" width="220" height="120" rx="8" fill="#1A1D23" stroke="#262A33" />
  <text x="85" y="125" fill="#F5F5F4" font-family="Space Grotesk" font-size="13" font-weight="600">Question #04 / Technical</text>
  <text x="85" y="150" fill="#A8ADB8" font-family="Inter" font-size="11">Explain time complexity of quicksort</text>
  <text x="85" y="165" fill="#A8ADB8" font-family="Inter" font-size="11">in best &amp; worst cases.</text>
  <rect x="85" y="180" width="90" height="24" rx="4" fill="#0F766E" />
  <text x="130" y="196" fill="#F5F5F4" font-family="Inter" font-size="10" text-anchor="middle">Evaluating...</text>

  <!-- Response Feedback Card -->
  <rect x="310" y="100" width="220" height="210" rx="8" fill="#1A1D23" stroke="#D6B25E" stroke-width="1" />
  <text x="325" y="125" fill="#D6B25E" font-family="Space Grotesk" font-size="12" font-weight="700">Claude AI Real-time Feedback</text>
  <text x="325" y="150" fill="#10B981" font-family="Inter" font-size="11">✓ Conceptual Accuracy: 95%</text>
  <text x="325" y="170" fill="#10B981" font-family="Inter" font-size="11">✓ Depth of Explanation: High</text>
  <text x="325" y="190" fill="#F5F5F4" font-family="Inter" font-size="10">Key Strength: Good average O(N log N)</text>
  <text x="325" y="205" fill="#F5F5F4" font-family="Inter" font-size="10">case analysis and pivot selection.</text>

  <!-- Progress Bar Mock -->
  <rect x="70" y="240" width="220" height="70" rx="8" fill="#1A1D23" />
  <text x="85" y="265" fill="#A8ADB8" font-family="Inter" font-size="11">Overall Assessment Score</text>
  <text x="85" y="295" fill="#D6B25E" font-family="Space Grotesk" font-size="22" font-weight="700">92 / 100</text>
</svg>
