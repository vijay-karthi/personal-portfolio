<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B25E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#856414" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D23" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1115" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base Frame -->
  <rect width="800" height="600" rx="24" fill="#0F1115" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#262A33" stroke-width="1" opacity="0.4">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" />
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="220" r="180" fill="url(#emeraldGrad)" filter="url(#glow)" opacity="0.6" />
  <circle cx="580" cy="380" r="160" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.4" />

  <!-- Code / Architecture UI Dashboard Mock -->
  <rect x="100" y="80" width="600" height="440" rx="16" fill="url(#cardBg)" stroke="#2F3440" stroke-width="2" />
  
  <!-- Window Header Controls -->
  <circle cx="130" cy="110" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="150" cy="110" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="170" cy="110" r="6" fill="#10B981" opacity="0.8" />
  <text x="400" y="114" fill="#A8ADB8" font-family="Space Grotesk, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">vijay_karthi_core_engine.py</text>
  <line x1="100" y1="130" x2="700" y2="130" stroke="#262A33" stroke-width="1.5" />

  <!-- Abstract Analytics Node Network -->
  <!-- Nodes & Connectors -->
  <path d="M 180,240 L 320,190 L 480,260 L 620,200 M 320,190 L 380,360 L 520,380 M 180,240 L 260,390 L 380,360 M 480,260 L 520,380 L 620,200" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="6,6" fill="none" opacity="0.7"/>

  <!-- Glowing Nodes -->
  <circle cx="180" cy="240" r="10" fill="#0F766E" stroke="#F5F5F4" stroke-width="2" />
  <circle cx="320" cy="190" r="14" fill="#D6B25E" stroke="#F5F5F4" stroke-width="2" />
  <circle cx="480" cy="260" r="12" fill="#0F766E" stroke="#F5F5F4" stroke-width="2" />
  <circle cx="620" cy="200" r="16" fill="#D6B25E" stroke="#F5F5F4" stroke-width="2.5" />
  <circle cx="260" cy="390" r="11" fill="#0F766E" stroke="#F5F5F4" stroke-width="2" />
  <circle cx="380" cy="360" r="15" fill="#0F766E" stroke="#F5F5F4" stroke-width="2.5" />
  <circle cx="520" cy="380" r="10" fill="#D6B25E" stroke="#F5F5F4" stroke-width="2" />

  <!-- Terminal Snippet Widget -->
  <rect x="140" y="420" width="300" height="70" rx="8" fill="#0F1115" stroke="#0F766E" stroke-width="1.5" />
  <text x="160" y="445" fill="#0F766E" font-family="monospace" font-size="12">> algorithm.optimize(data_stream)</text>
  <text x="160" y="468" fill="#D6B25E" font-family="monospace" font-size="12">✓ Status: 200 OK [REST API Active]</text>

  <!-- Performance Metric Badge -->
  <rect x="470" y="420" width="190" height="70" rx="8" fill="#0F1115" stroke="#D6B25E" stroke-width="1.5" />
  <text x="490" y="445" fill="#A8ADB8" font-family="Inter, sans-serif" font-size="11">ACCURACY METRIC</text>
  <text x="490" y="470" fill="#F5F5F4" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">99.4% <tspan fill="#D6B25E" font-size="12">YOLO v8</tspan></text>
</svg>
