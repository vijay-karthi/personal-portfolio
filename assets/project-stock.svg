<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1A1D23" />
  <g stroke="#262A33" stroke-width="1">
    <path d="M0,50 H600 M0,100 H600 M0,150 H600 M0,200 H600 M0,250 H600 M0,300 H600 M0,350 H600" />
    <path d="M50,0 V400 M100,0 V400 M150,0 V400 M200,0 V400 M250,0 V400 M300,0 V400 M350,0 V400 M400,0 V400 M450,0 V400 M500,0 V400 M550,0 V400" />
  </g>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#0F1115" stroke="#D6B25E" stroke-width="1.5" />
  <rect x="40" y="40" width="520" height="40" rx="16" fill="#1A1D23" />
  <circle cx="70" cy="60" r="5" fill="#EF4444"/>
  <circle cx="85" cy="60" r="5" fill="#F59E0B"/>
  <circle cx="100" cy="60" r="5" fill="#10B981"/>
  <text x="300" y="65" fill="#F5F5F4" font-family="Space Grotesk" font-size="12" text-anchor="middle">Stock Market Analysis Tool — Python / yfinance / pandas</text>
  
  <!-- Financial Stock Chart Wave -->
  <path d="M 70,280 Q 150,220 200,250 T 320,180 T 420,130 L 520,110" fill="none" stroke="#0F766E" stroke-width="3" />
  <path d="M 70,280 Q 150,220 200,250 T 320,180 T 420,130 L 520,110 L 520,310 L 70,310 Z" fill="url(#stockGrad)" opacity="0.3" />
  
  <defs>
    <linearGradient id="stockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Candle Sticks -->
  <line x1="120" y1="210" x2="120" y2="270" stroke="#10B981" stroke-width="2"/>
  <rect x="115" y="225" width="10" height="30" fill="#10B981" />
  
  <line x1="240" y1="180" x2="240" y2="240" stroke="#10B981" stroke-width="2"/>
  <rect x="235" y="195" width="10" height="30" fill="#10B981" />

  <line x1="360" y1="130" x2="360" y2="190" stroke="#D6B25E" stroke-width="2"/>
  <rect x="355" y="145" width="10" height="25" fill="#D6B25E" />

  <!-- Metric Badges -->
  <rect x="70" y="90" width="140" height="50" rx="6" fill="#1A1D23" stroke="#262A33"/>
  <text x="80" y="110" fill="#A8ADB8" font-family="Inter" font-size="10">200-DAY SMA</text>
  <text x="80" y="130" fill="#D6B25E" font-family="Space Grotesk" font-size="14" font-weight="700">+24.8% TREND</text>

  <rect x="230" y="90" width="140" height="50" rx="6" fill="#1A1D23" stroke="#262A33"/>
  <text x="240" y="110" fill="#A8ADB8" font-family="Inter" font-size="10">VOLATILITY (NumPy)</text>
  <text x="240" y="130" fill="#0F766E" font-family="Space Grotesk" font-size="14" font-weight="700">σ = 0.0142</text>
</svg>
